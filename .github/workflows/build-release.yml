name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: '版本标签 (例如: v1.0.0)'
        required: false
        type: string
        default: ''
      create_release:
        description: '是否创建 Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '是否为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build static binary for ${{ matrix.os }}/${{ matrix.arch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o go-argo-${{ matrix.os }}-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-argo-${{ matrix.os }}-${{ matrix.arch }}
          path: go-argo-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist/

      - name: Set tag and release name
        id: set_tag
        run: |
          if [ -z "${{ github.event.inputs.version_tag }}" ]; then
            echo "tag_name=manual-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release_name=Manual Build #${{ github.run_number }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
            echo "release_name=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_tag.outputs.tag_name }}
          name: ${{ steps.set_tag.outputs.release_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-only:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'false' || github.event.inputs.create_release == ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List built artifacts
        run: |
          echo "✅ 构建完成，文件列表："
          ls -lhR artifacts/
          echo ""
          echo "📥 下载地址：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
